<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23168A82%27/%3E%3Cpath d=%27M36 8 L16 36 H30 L26 56 L48 26 H34 Z%27 fill=%27%23F2B630%27 stroke=%27%2323305E%27 stroke-width=%273%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="AI와 함께 만드는 사람을 위한 두 권의 웹북. 컴퓨터 과학 기초와 하네스 엔지니어링을 그림책과 도식 교과서로 읽어요.">
<meta property="og:type" content="website">
<meta property="og:title" content="AI 개발 책장">
<meta property="og:description" content="AI와 함께 만드는 사람을 위한 두 권의 웹북. 컴퓨터 과학 기초와 하네스 엔지니어링을 그림책과 도식 교과서로 읽어요.">
<meta property="og:url" content="https://notadev-iamaura.github.io/harness-book/">
<meta property="og:image" content="https://notadev-iamaura.github.io/harness-book/og.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI 개발 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* Layout: 한 장씩 넘기는 그림책. 넓은 책은 왼쪽 액자 그림 + 오른쪽 이야기, 좁은 책은 위 그림 + 아래 이야기.
   이야기 아래에는 테이프로 붙인 '개발자 메모' 카드. 청록색은 오직 장비(하네스)에만 쓴다.
   인쇄된 그림책 한 권이라는 하나의 모습으로 고정한 단일 라이트 디자인. */
:root{
  --desk:#DCE1D5;
  --desk-line:#D2D8CA;
  --paper:#FCFBF7;
  --paper-back:#EFEEE5;
  --ink:#23305E;
  --ink-soft:#5A648C;
  --teal:#168A82;
  --teal-wash:#E1F1EE;
  --sun:#F2B630;
  --berry:#D4505A;
  --rule:#D7DAE5;
  --code-bg:#ECEFF7;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-story:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--desk);
  background-image:repeating-linear-gradient(90deg,transparent 0 3px,var(--desk-line) 3px 4px),repeating-linear-gradient(0deg,transparent 0 3px,var(--desk-line) 3px 4px);
  background-blend-mode:multiply;
  color:var(--ink);font-family:var(--font-ui);font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.app{
  height:100%;max-width:1060px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-size:18px;line-height:1.2;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--teal)}
.ghost{
  font:600 13px/1 var(--font-ui);color:var(--ink);background:transparent;
  border:1.5px solid var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;
}
.ghost:hover{background:rgba(35,48,94,.06)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- 책 ---------- */
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.book{
  position:relative;width:100%;height:100%;max-width:1000px;max-height:680px;
  perspective:2400px;touch-action:pan-y;
}
.book::before{
  content:"";position:absolute;inset:0;border-radius:3px 10px 10px 3px;background:var(--paper-back);
  box-shadow:3px 3px 0 -1px #EAE9E0,6px 6px 0 -2px #E1E0D6,9px 9px 0 -3px #D9D8CD,0 26px 50px -14px rgba(35,48,94,.38);
}
/* 책장: 멈춰 있을 땐 지금 쪽 하나만, 넘길 때는 두 장만 보인다.
   앞뒷면(backface)·preserve-3d 없이 90도까지만 돌려서 아이폰 WebKit에서도 겹치지 않게 한다. */
.leaf{position:absolute;inset:0;transform-origin:left center;visibility:hidden}
.leaf.cur,.leaf.under,.leaf.lift{visibility:visible}
.leaf.under{z-index:1}
.leaf.cur{z-index:2}
.leaf.lift{z-index:3}
.leaf.away{transform:rotateY(-90deg)}
.leaf.anim{transition:transform .6s;will-change:transform}
.leaf.fwd{transition-timing-function:cubic-bezier(.55,.06,.68,.19)}
.leaf.back{transition-timing-function:cubic-bezier(.25,.46,.45,.94)}
.face{
  position:absolute;inset:0;overflow:hidden;background:var(--paper);
  border-radius:3px 10px 10px 3px;
}
.face::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:22px;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(35,48,94,.16),rgba(35,48,94,0));
}
.face::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:linear-gradient(90deg,rgba(35,48,94,.04),rgba(35,48,94,.34));
}
.leaf.fwd .face::after{animation:shadeIn .6s ease-in both}
.leaf.back .face::after{animation:shadeOut .6s ease-out both}
@keyframes shadeIn{from{opacity:0}to{opacity:1}}
@keyframes shadeOut{from{opacity:1}to{opacity:0}}
.fade{position:absolute;left:0;right:0;bottom:0;height:24px;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(252,251,247,0),var(--paper))}

/* 좁은 화면: 그림과 글이 위아래로 이어지고, 쪽 전체가 한 덩어리로 스크롤된다 */
.page{
  position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:16px;
  padding:16px 16px 30px 22px;
}
.plate{
  flex:none;margin:0;align-self:center;width:var(--pw,100%);height:var(--ph,200px);max-width:100%;
  border-radius:10px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 2px var(--ink),4px 5px 0 0 rgba(35,48,94,.14);
}
.plate svg{display:block;width:100%;height:100%}
.plate svg text{font-family:var(--font-ui);font-weight:600}
.plate svg .svg-d{font-family:var(--font-display);font-weight:400}
.plate svg .svg-m{font-family:var(--font-mono);font-weight:500}
.text{flex:none;min-width:0;padding:0 2px}
.text-inner{display:flex;flex-direction:column;gap:12px}
.chapter{margin:0;font:600 12px/1.2 var(--font-ui);letter-spacing:.08em;color:var(--teal)}
.text h2{margin:-4px 0 0;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.2;text-wrap:balance;color:var(--ink);overflow-wrap:anywhere}
.story p{margin:0 0 .55em;font-family:var(--font-story);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.story p:last-child{margin-bottom:0}
.note{
  position:relative;background:#fff;border:1.5px solid var(--rule);border-radius:6px;
  padding:14px 14px 12px;margin-top:6px;
  background-image:linear-gradient(transparent 0 25px,#EEF0F7 25px 26px);
}
.note::before{
  content:"";position:absolute;top:-9px;left:20px;width:58px;height:17px;
  background:rgba(242,182,48,.55);transform:rotate(-4deg);border-radius:2px;
}
.note-label{margin:0 0 6px;font:600 12px/1.2 var(--font-ui);letter-spacing:.06em;color:var(--teal)}
.note ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.note li{font-size:13.5px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.note li::marker{color:var(--teal)}
.note b,.story b{font-weight:600}
code{font-family:var(--font-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px;word-break:break-all}
.refs{margin:10px 0 0;font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px}
.refs a{color:var(--teal);text-underline-offset:3px}
.folio{flex:none;align-self:flex-end;font:500 11px/1 var(--font-mono);color:var(--ink-soft)}
.teal{color:var(--teal)}

/* 표지 */
.cover h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.1;color:var(--ink);text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--teal)}
.cover .lead{margin:0;font-family:var(--font-story);font-size:16px;line-height:1.7;word-break:keep-all}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:0}
.legend i{width:26px;height:10px;border-radius:5px;background:var(--teal);flex:none}
.credit{margin:0;font-size:12px;color:var(--ink-soft)}
.credit a{color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.solid{
  font:600 14px/1 var(--font-ui);color:var(--paper);background:var(--ink);border:1.5px solid var(--ink);
  border-radius:999px;padding:12px 20px;cursor:pointer;
}
.solid:hover{background:#1A2550}

/* 단어장 */
.glossary{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline}
.glossary dt{font-family:var(--font-display);font-size:16px;color:var(--ink);white-space:nowrap}
.glossary dd{margin:0;font-size:13.5px;line-height:1.6;word-break:keep-all;min-width:0}

/* 넓은 화면(.wide는 JS가 책 크기를 재서 붙인다): 왼쪽 그림, 오른쪽 글. 글 칸만 스크롤 */
.book.wide .page{overflow:hidden;display:grid;grid-template-columns:var(--pw) minmax(0,1fr);gap:44px;align-items:center;padding:40px 46px 40px 56px}
.book.wide .text{
  align-self:stretch;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:2px 6px 22px 2px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
}
.book.wide .text-inner{margin-block:auto}
.book.wide .fade{display:none}
.book.wide .story p{font-size:18px}
.book.wide .text h2{font-size:40px}
.book.wide .note li{font-size:14.5px}
.book.wide .cover h1{font-size:58px}
.book.wide .cover .lead{font-size:17.5px}
.book.wide .folio{position:absolute;right:24px;bottom:14px}

/* ---------- 2부 심화편: 교과서 쪽 ---------- */
.leaf.tbp .plate{width:var(--pwt,100%);height:var(--pht,200px)}
.book.wide .leaf.tbp .page{grid-template-columns:var(--pwt) minmax(0,1fr)}
.tb-kicker{margin:0;display:flex;align-items:center;gap:10px;font:600 12px/1.2 var(--font-ui);letter-spacing:.06em;color:var(--teal)}
.tb-no{font:500 12px/1 var(--font-mono);letter-spacing:0;color:var(--paper);background:var(--ink);border-radius:4px;padding:5px 7px}
.tb-lede{margin:0;font-family:var(--font-story);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.tb h3{margin:10px 0 -2px;display:flex;align-items:center;gap:8px;font:600 15px/1.35 var(--font-ui);color:var(--ink)}
.tb h3::before{content:"";flex:none;width:12px;height:3px;border-radius:2px;background:var(--teal)}
.tb p.tp{margin:0;font-size:14.5px;line-height:1.72;word-break:keep-all;overflow-wrap:anywhere}
.tb .tl{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.tb .tl li{font-size:14px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;padding-left:2px}
.tb .tl li::marker{color:var(--teal);font-weight:600}
.tb .tl a{color:var(--teal);text-underline-offset:3px}
.code-fig{margin:0;min-width:0}
pre.code{
  margin:0;padding:12px 14px;border-radius:8px;background:#1F2A52;color:#E8ECF7;
  font:500 12px/1.6 var(--font-mono);white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;
}
pre.code code{font:inherit;background:none;padding:0;border-radius:0;color:inherit;word-break:normal}
.code-fig figcaption{margin-top:6px;font-size:12px;line-height:1.5;color:var(--ink-soft);word-break:keep-all}
.tbl-wrap{min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--rule);border-radius:8px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule);word-break:keep-all}
.tbl thead th{background:var(--code-bg);font-size:12px;font-weight:600;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.tbl-wide{min-width:520px}
.tbl-xwide{min-width:760px}
.key{background:var(--teal-wash);border-radius:10px;padding:12px 14px}
.key .note-label{margin:0 0 6px}
.key ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.key li{font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.key li::marker{color:var(--teal)}
.tb-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.tb-foot .refs{margin:0}
.link-btn{font:600 12.5px/1 var(--font-ui);color:var(--teal);background:transparent;border:1.5px solid var(--teal);border-radius:999px;padding:8px 12px;cursor:pointer}
.link-btn:hover{background:var(--teal-wash)}
.ck-count{margin:0;font:500 12px/1 var(--font-mono);color:var(--ink-soft)}
.ck-group{display:flex;flex-direction:column;gap:6px}
.ck-title{margin:6px 0 0;font:600 13px/1.2 var(--font-ui);color:var(--teal)}
.ck{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.ck input{flex:none;width:17px;height:17px;margin:2px 0 0;accent-color:var(--teal)}
.ck:has(input:checked){background:var(--teal-wash);border-color:var(--teal)}
.ck input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.toc-part{padding:14px 4px 6px;font:600 12px/1.2 var(--font-ui);letter-spacing:.06em;color:var(--teal)}
.toc-part:first-child{padding-top:4px}

/* ---------- 아래 조작부 ---------- */
.controls{display:flex;align-items:center;gap:12px;max-width:1000px;width:100%;margin:0 auto}
.nav-btn{
  flex:none;height:44px;min-width:44px;padding:0 16px;border-radius:999px;cursor:pointer;
  font:600 14px/1 var(--font-ui);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
}
.nav-btn.primary{background:var(--ink);color:var(--paper)}
.nav-btn:disabled{opacity:.32;cursor:default}
.nav-btn svg{width:16px;height:16px}
.progress{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}
/* 진행 막대: 세로 눈금이 1부와 2부의 경계 */
.track{position:relative;width:min(100%,300px);height:6px;border-radius:3px;background:#C9CFDD}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--teal);transition:width .4s ease}
.track .tick{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.where{font:500 12px/1.2 var(--font-ui);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
@media (max-width:420px){.nav-btn .lbl{display:none}.nav-btn{padding:0 13px}}

/* ---------- 목차 ---------- */
.toc{position:fixed;inset:0;z-index:50;background:rgba(35,48,94,.38);display:flex;align-items:flex-end;justify-content:center}
.toc-panel{
  width:100%;max-width:520px;max-height:78%;overflow:auto;background:var(--paper);
  border-radius:16px 16px 0 0;
  padding:18px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
}
@media (min-width:700px){.toc{align-items:center}.toc-panel{border-radius:16px}}
.toc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toc-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li button{
  width:100%;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 4px;cursor:pointer;color:var(--ink);
  font:500 15px/1.4 var(--font-ui);
}
.toc li button:hover{background:rgba(22,138,130,.06)}
.toc li .n{font:500 12px/1 var(--font-mono);color:var(--ink-soft)}
.toc li .c{display:block;font-size:11.5px;color:var(--teal);font-weight:600;letter-spacing:.04em}
.toc li button[aria-current="page"]{background:var(--teal-wash)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 그림 속 애니메이션 (펼쳐진 쪽에서만 재생) ---------- */
.plate .leg,.plate .tail,.plate .bell,.plate .pop,.plate .stamp,.plate .wob,.plate .spin,.plate .twinkle,.plate .blink,
.plate .q,.plate .fallbox,.plate .wave,.plate .gate,.plate .sweep,.plate .puff,.plate .float,.plate .jump,.plate .sunrise,.plate .dim,.plate .trail,.plate .ok8,.plate .thru,.plate .glow,.plate .drift{transform-box:fill-box}
.plate .leg{transform-origin:50% 0%}
.plate .tail{transform-origin:100% 0%}
.plate .bell{transform-origin:50% 0%}
.plate .sweep{transform-origin:50% 0%}
.plate .wob{transform-origin:50% 100%}
.plate .gate{transform-origin:0% 50%}
.plate .pop,.plate .stamp,.plate .spin,.plate .twinkle,.plate .blink,.plate .wave,.plate .ok8,.plate .glow{transform-origin:50% 50%}

.play .run .la{animation:legA .42s ease-in-out infinite alternate}
.play .run .lb{animation:legB .42s ease-in-out infinite alternate}
.play .run{animation:bob .21s ease-in-out infinite alternate}
.play .tail{animation:sway 1.1s ease-in-out infinite alternate}
.play .blink{animation:blink 4.6s ease-in-out infinite}
.play .spin{animation:spin 26s linear infinite}
.play .drift{animation:drift 9s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.play .twinkle{animation:twinkle 1.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.play .pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
.play .float{animation:floaty 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.play .q{animation:qrise 2.4s ease-in infinite;animation-delay:var(--d,0s)}
.play .fade-mem{animation:fademem 3.4s ease-in-out infinite}
.play .wob{animation:wob 1.05s ease-in-out infinite alternate}
.play .fallbox{animation:fallbox 2.8s ease-in infinite;animation-delay:var(--d,0s)}
.play .stamp{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,0s)}
.play .bell{animation:ring .9s ease-in-out infinite}

.top-actions{display:flex;gap:8px;flex:none}
.shelf{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shelf-inner{

  box-shadow:3px 3px 0 -1px #EAE9E0,6px 6px 0 -2px #E1E0D6,0 22px 40px -16px rgba(35,48,94,.4);
}
.bookcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:20px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(35,48,94,.18),rgba(35,48,94,0));pointer-events:none}

.bookcard .meta{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}

#root{height:100%}

  { type: 'tb', no: '04', kicker: '지시', title: '지도는 짧게, 자세한 건 서랍에', storyPage: 6,

  { type: 'tb', no: '01', kicker: '컴퓨터의 몸', title: 'CPU, 메모리, 저장장치', storyPage: 2,
    lede: '컴퓨터는 분식집 주방과 닮았어요. 요리사, 조리대, 창고가 맡은 일이 서로 달라서, 하나가 넉넉해도 다른 하나가 모자라면 전체가 느려져요.',
    blocks: [
      { h: '세 부품이 하는 일' },
      { table: { head: ['부품', '주방에서는', '하는 일'], rows: [
        ['CPU', '요리사', '프로그램의 명령을 하나씩 가져와 계산해요.'],
        ['메모리(RAM)', '조리대', '실행 중인 프로그램과 데이터를 펼쳐 놓는 자리예요. 전원을 끄면 사라져요.'],
        ['저장장치', '창고', '사진, 앱, 파일을 오래 보관해요. 전원을 꺼도 남아요.'],
        ['GPU', '손이 수천 개인 보조', '같은 종류의 단순한 계산을 한꺼번에 많이 해요. 그래픽과 AI 계산에 써요.']] } },
      { h: '왜 따로 둘까' },
      { ul: ['빠른 부품일수록 비싸고 담는 양이 적어요. CPU 바로 옆이 가장 빠르고, 저장장치가 가장 느려요.',
             '그래서 지금 쓰는 것만 메모리에 올려 두고, 나머지는 저장장치에 둬요.',
             '프로그램을 켜는 일은 창고(저장장치)에서 조리대(메모리)로 재료를 옮기는 일이에요.'] },
      { h: '느릴 때 무엇이 모자란지 가리기' },
      { ul: ['프로그램을 여러 개 켜면 느려진다: <b>메모리</b>가 모자라요. 저장장치를 큰 것으로 바꿔도 해결되지 않아요.',
             '파일을 저장할 수 없다: <b>저장 공간</b>이 모자라요.',
             '한 프로그램이 계산하느라 오래 걸린다: <b>CPU</b>가 바빠요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['“느려요”라고만 하지 말고, 무엇을 할 때 느린지와 메모리·CPU 사용량을 함께 알려 줘요.',
             'AI가 “사양을 올리세요”라고 하면 어느 부품이 왜 모자란지 근거를 물어봐요.'] }
    ],
    key: ['메모리는 “얼마나 보관하나”가 아니라 “한 번에 얼마나 펼쳐 놓나”를 정해요.', '저장 공간이 남아도 메모리가 모자라면 컴퓨터는 느려져요.'],
    refs: [ch(1)] },

  { type: 'tb', no: '02', kicker: '0과 1', title: '스위치로 모든 것을 적는 법', storyPage: 3,
    lede: '컴퓨터 안의 모든 것은 켜짐과 꺼짐뿐인 스위치 줄이에요. 그 줄을 어떤 약속으로 읽느냐에 따라 숫자도, 글자도, 그림도 돼요.',
    blocks: [
      { h: '비트와 바이트' },
      { ul: ['스위치 하나가 <b>비트</b>예요. 0 아니면 1이에요.',
             '비트 8개를 묶은 것이 <b>바이트</b>예요. 256가지(0~255)를 구분할 수 있어요.',
             '파일 크기의 KB, MB, GB는 바이트를 세는 단위예요.'] },
      { h: '같은 바이트, 다른 약속' },
      { table: { head: ['무엇을', '어떤 약속으로', '알아 둘 점'], rows: [
        ['정수', '2진수', '칸이 꽉 차면 처음으로 돌아가요(오버플로).'],
        ['소수', '부동소수점', '0.1 + 0.2가 정확히 0.3이 아니에요. 돈 계산은 정수(원 단위)로 해요.'],
        ['글자', '문자표 + 인코딩(UTF-8)', '한글이 깨지면 읽는 인코딩이 틀린 거예요.'],
        ['색과 그림', '점 하나에 숫자 세 개(빨강·초록·파랑)', '사진은 이 점들의 큰 표예요.']] } },
      { code: '0.1 + 0.2        →  0.30000000000000004\n4000 * 0.9       →  3600.0000000000005 일 수도 있음\n4000 * 90 / 100  →  3600 (정수로 계산)', cap: '돈처럼 딱 떨어져야 하는 값은 소수로 계산하지 않아요.' },
      { h: 'AI에게 맡길 때' },
      { ul: ['금액, 수량처럼 정확해야 하는 값은 “정수로 계산해 줘”라고 미리 말해요.',
             '글자가 깨지면 “인코딩을 UTF-8로 맞춰서 읽고 써 줘”라고 좁혀서 말해요.',
             '파일 확장자만 바꾼다고 내용이 바뀌지는 않아요. 바이트는 자기가 무엇인지 스스로 말하지 않아요.'] }
    ],
    key: ['컴퓨터 안의 모든 것은 스위치 줄이고, 읽는 약속이 의미를 정해요.', '글자가 깨졌어도 데이터는 멀쩡해요. 틀린 것은 읽는 규칙이에요.'],
    refs: [ch(2)] },

  { type: 'tb', no: '03', kicker: '운영체제', title: '프로그램들의 차례와 자리', storyPage: 4,
    lede: '운영체제는 주방을 돌리는 지배인이에요. 요리사(CPU)를 누가 언제 쓸지, 조리대(메모리)의 어느 자리를 쓸지 정해요.',
    blocks: [
      { h: '프로세스와 스케줄링' },
      { ul: ['실행 중인 프로그램 한 건이 <b>프로세스</b>예요. 프로세스마다 자기만의 메모리 공간을 받아요.',
             '운영체제는 CPU를 아주 짧은 시간씩 나눠 여러 프로세스에 돌려 줘요. 이게 <b>스케줄링</b>이에요.',
             '정말로 같은 순간에 계산되는 일의 수는 CPU 코어 수를 넘지 못해요.',
             '한 프로세스 안에서 갈라진 여러 흐름이 <b>스레드</b>예요. 같은 메모리를 함께 써요.'] },
      { h: '창고는 지배인을 거쳐서만' },
      { p: '프로그램은 파일, 네트워크, 화면 같은 하드웨어를 직접 만지지 못해요. 운영체제의 핵심인 <b>커널</b>에 부탁해야 해요. 이 부탁이 <b>시스템 호출</b>이에요.' },
      { h: '값과 참조' },
      { ul: ['값을 복사하면 따로따로예요. 하나를 바꿔도 다른 하나는 그대로예요.',
             '위치(참조)를 복사하면 같은 것을 둘이 가리켜요. 하나를 바꾸면 같이 바뀌어요.',
             '“복사했는데 왜 원본도 바뀌지?”의 범인은 대부분 참조 복사예요.'] },
      { h: '치우기' },
      { ul: ['안 쓰는 메모리를 돌려주지 않으면 조금씩 쌓여요. 이게 <b>메모리 누수</b>예요.',
             '파일, 네트워크 연결처럼 연 것은 닫아요. 잘됐을 때만이 아니라 실패했을 때도요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['파일이나 연결을 여는 코드를 받으면 “실패했을 때도 닫히는지” 확인해요.',
             '오래 켜 둘수록 느려지는 프로그램은 “메모리 누수를 의심해서 찾아 줘”라고 좁혀서 말해요.'] }
    ],
    key: ['“동시에 실행된다”는 대부분 아주 빠른 교대예요.', '연 것은 닫아요. 실패했을 때도요.'],
    refs: [ch(3)] },

  { type: 'tb', no: '04', kicker: '실행', title: '코드가 실행되기까지', storyPage: 5,
    lede: 'CPU는 0과 1로 된 기계의 말만 알아들어요. 사람이 쓴 코드는 번역을 거쳐야 실행돼요.',
    blocks: [
      { h: '번역하는 두 가지 방식' },
      { table: { head: ['방식', '비유', '특징'], rows: [
        ['컴파일러', '책을 통째로 옮기는 번역가', '미리 다 번역해 실행 파일을 만들어요. 실행이 빨라요.'],
        ['인터프리터', '한 문장씩 옮기는 통역사', '실행하면서 한 줄씩 옮겨요. 고치고 바로 돌려 보기 좋아요.']] } },
      { p: '둘을 섞은 방식도 많아요. 중간 형태(바이트코드)로 한 번 번역해 두고, 가상 머신이 그것을 실행해요.' },
      { h: '오류가 드러나는 세 시점' },
      { ol: ['<b>번역할 때</b>: 문법이나 타입이 틀렸어요. 실행 전에 알려 줘서 가장 싸게 잡혀요.',
             '<b>실행할 때</b>: 없는 파일을 열거나 0으로 나눠요. 그 줄에 닿아야 드러나요.',
             '<b>끝난 뒤</b>: 오류 없이 돌아가는데 답이 틀려요. 아무도 알려 주지 않아서 가장 찾기 어려워요.'] },
      { h: '링크와 빌드' },
      { ul: ['내 코드는 남이 만든 코드(라이브러리)와 이어 붙여야 완성돼요. 이 과정이 <b>링크</b>예요.',
             '코드를 실행할 수 있는 결과물로 만드는 전체 과정이 <b>빌드</b>예요.',
             '같은 코드도 개발용으로 만들면 찾기 쉽고 느리게, 배포용으로 만들면 작고 빠르게 만들어져요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['“오류 없이 빌드됐습니다”는 끝이 아니에요. 실제로 실행한 결과를 보여 달라고 해요.',
             '오류 글은 요약하지 말고 전체를 그대로 붙여 줘요. 어느 시점의 오류인지가 실마리예요.'] }
    ],
    key: ['“오류 없이 번역됐다”는 “맞게 움직인다”가 아니에요.', '오류는 늦게 드러날수록 찾기 어렵고 비싸요.'],
    refs: [ch(4)] },

  { type: 'tb', no: '05', kicker: '작업대', title: '터미널과 개발 환경', storyPage: 6,
    lede: '터미널은 글로 주문하는 창구예요. AI 코딩 도구도 결국 이 창구에서 명령을 실행해요. 그래서 명령 한 줄을 읽을 수 있어야 맡길 수 있어요.',
    blocks: [
      { h: '명령 한 줄 읽기' },
      { code: 'ls -l src\n│  │  └─ 인수: 어디에 (src 폴더)\n│  └──── 옵션: 어떻게 (자세히)\n└─────── 명령: 무엇을 (목록 보기)', cap: '대부분의 명령이 이 세 조각으로 되어 있어요.' },
      { ul: ['<code>pwd</code>는 지금 서 있는 폴더를 알려 줘요. 상대 경로를 보면 “지금 어디에 서 있지?”부터 물어요.',
             '<code>|</code>(파이프)는 앞 명령의 결과를 다음 명령으로, <code>&gt;</code>는 파일로 보내요.',
             '명령은 끝날 때 <b>종료 코드</b>를 남겨요. 0이면 성공, 0이 아니면 실패예요.'] },
      { h: '개발 환경: 작업실이 같아야 해요' },
      { ul: ['코드는 설계도일 뿐이에요. 돌아가려면 언어 버전, 패키지, 설정이 갖춰진 작업실이 필요해요.',
             '“내 컴퓨터에서는 되는데요”는 작업실이 다르다는 신호예요. 코드보다 두 환경의 차이를 먼저 봐요.',
             '<b>환경 변수</b>는 작업실 벽에 붙인 메모예요. 비밀 값과 설정을 코드 밖에 둘 때 써요.',
             '“설치되어 있다”와 “지금 그것이 실행된다”는 다른 말이에요. <code>PATH</code> 순서에 따라 다른 버전이 실행될 수 있어요.'] },
      { h: '지우기 전에 묻는 세 가지' },
      { ol: ['지금 어디에 서 있는가', '무엇이 지워지는가', '다시 만들 수 있는가'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['AI가 명령을 실행하려 하면 허용하기 전에 읽어요. 특히 지우기(<code>rm</code>), 덮어쓰기, <code>sudo</code>가 있는지 봐요.',
             '<code>Permission denied</code>가 나오면 <code>sudo</code>를 붙이기 전에 물어요. 누가, 어느 파일에, 무엇을 하려다 막혔는가.',
             '마지막 줄의 “완료”는 아무것도 약속하지 않아요. 종료 코드와 실제 결과를 확인해요.'] }
    ],
    key: ['셸의 힘은 큰 명령 하나가 아니라 작은 명령을 잇는 데서 나와요.', '믿을 것은 “완료”라는 글자가 아니라 종료 코드예요.'],
    refs: [ch(5), ch(6)] },

  { type: 'tb', no: '06', kicker: '변경 이력', title: 'Git으로 저장 지점 쌓기', storyPage: 6,
    lede: '파일을 “최종”, “진짜최종”으로 복사해 쌓는 대신, Git은 돌아올 수 있는 저장 지점을 쌓아요. AI와 일할 때는 이 저장 지점이 안전망이에요.',
    blocks: [
      { h: '세 구역' },
      { table: { head: ['구역', '하는 일', '명령'], rows: [
        ['작업 폴더', '파일을 고치는 곳', '—'],
        ['스테이지', '이번 저장 지점에 넣을 것을 담는 곳', '<code>git add</code>'],
        ['저장소', '저장 지점(커밋)이 쌓이는 곳', '<code>git commit</code>']] } },
      { p: '커밋에 들어가는 것은 작업 폴더의 파일이 아니라 스테이지에 올려 둔 내용이에요.' },
      { h: '브랜치와 병합' },
      { ul: ['<b>브랜치</b>는 커밋에 붙이는 이름표예요. 실험은 새 브랜치에서 하고, 잘되면 합쳐요(<b>병합</b>).',
             '두 사람이 같은 줄을 다르게 고치면 <b>충돌</b>이 나요. 어느 쪽을 남길지 사람이 정해야 해요.',
             '<code>git diff</code>로 무엇이 바뀌었는지 읽어요. AI가 고친 것을 확인하는 가장 확실한 방법이에요.'] },
      { h: '되돌리기 세 가지' },
      { table: { head: ['명령', '하는 일', '안전한가'], rows: [
        ['<code>restore</code>', '아직 커밋하지 않은 수정을 버려요', '버린 수정은 못 살려요'],
        ['<code>revert</code>', '되돌리는 새 커밋을 만들어요', '이력이 남아서 안전해요'],
        ['<code>reset</code>', '이름표를 과거로 옮겨요', '이미 공유한 커밋에는 쓰지 않아요']] } },
      { h: 'AI에게 맡길 때' },
      { ul: ['큰 일을 맡기기 전에 커밋해 둬요. 망가지면 그 지점으로 돌아가면 돼요.',
             'AI가 끝냈다고 하면 <code>git diff</code>로 바뀐 곳을 직접 읽어요. 부탁하지 않은 파일이 바뀌지 않았는지도 봐요.',
             'AI가 이력을 정리하겠다며 리베이스나 강제 푸시를 하려 하면, 이미 공유한 커밋인지부터 확인해요.'] }
    ],
    key: ['커밋은 언제든 돌아올 수 있는 저장 지점이에요.', '이미 공유한 커밋의 이력은 고쳐 쓰지 않아요.'],
    refs: [ch(7)] },

  { type: 'tb', no: '07', kicker: '자료구조', title: '데이터를 담는 그릇', storyPage: 7,
    lede: '같은 재료도 어떤 그릇에 담느냐에 따라 꺼내 쓰는 속도가 달라져요. 자료구조를 고른다는 것은 “이 데이터로 무엇을 가장 자주 할까”를 정하는 일이에요.',
    blocks: [
      { h: '자주 쓰는 그릇' },
      { table: { head: ['그릇', '생김새', '잘하는 일', '못하는 일'], wide: true, rows: [
        ['배열', '번호 붙은 칸이 나란히', '번호로 바로 꺼내기', '중간에 끼워 넣기'],
        ['스택', '접시 쌓기', '마지막에 넣은 것부터 꺼내기 (실행 취소)', '중간 것 꺼내기'],
        ['큐', '줄 서기', '먼저 온 것부터 처리하기 (주문 대기열)', '중간 것 꺼내기'],
        ['해시 맵', '이름표 붙은 서랍', '이름으로 바로 찾기', '순서대로 훑기'],
        ['트리', '위에서 아래로 갈라짐', '폴더처럼 포함 관계 담기, 정렬된 채로 찾기', '—'],
        ['그래프', '점과 선', '친구 관계, 길 찾기', '—']] } },
      { h: '오류가 가장 자주 나는 곳: 없음과 빈 값' },
      { ul: ['“값이 없음”, “빈 글자”, “0”은 서로 달라요. 섞어 쓰면 버그가 생겨요.',
             '주문이 하나도 없을 때, 이름이 비어 있을 때를 따로 생각해 둬요.'] },
      { h: '그릇 밖으로 내보낼 때' },
      { ul: ['프로그램끼리 데이터를 주고받을 때는 JSON 같은 약속된 글 형식으로 바꿔요.',
             '시각은 <b>UTC로 저장하고 비교</b>해요. 사람에게 보여 줄 때만 그 사람이 있는 곳의 시각으로 바꿔요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['“목록에서 자주 찾는다”, “순서가 중요하다”처럼 데이터를 어떻게 쓸지 말해 주면 알맞은 그릇을 골라요.',
             '받은 코드에서 “목록이 비어 있을 때”와 “값이 없을 때”를 어떻게 다루는지 확인해요.'] }
    ],
    key: ['만능 그릇은 없어요. 가장 자주 하는 일로 골라요.', '없음, 빈 값, 0은 서로 다른 것이에요.'],
    refs: [ch(8)] },

  { type: 'tb', no: '08', kicker: '알고리즘', title: '걸음 수로 재는 빠르기', storyPage: 7,
    lede: '알고리즘은 문제를 푸는 방법이에요. 빠르기는 “몇 초”가 아니라 데이터가 늘 때 걸음 수가 늘어나는 모양으로 말해요.',
    blocks: [
      { h: '빅오: 늘어나는 모양에 붙인 이름표' },
      { table: { head: ['이름표', '뜻', '예', '데이터가 10배면'], wide: true, rows: [
        ['O(1)', '데이터가 늘어도 그대로', '해시 맵에서 이름으로 찾기', '그대로'],
        ['O(log n)', '아주 조금씩 늘어남', '정렬된 목록에서 반씩 줄여 찾기', '몇 걸음 더'],
        ['O(n)', '데이터만큼 늘어남', '목록을 처음부터 끝까지 훑기', '10배'],
        ['O(n²)', '곱으로 늘어남', '반복문 안에 반복문', '100배']] } },
      { h: '느려지는 흔한 이유' },
      { ul: ['<b>반복 안의 반복</b>: 주문 1,000건마다 메뉴 1,000개를 훑으면 100만 걸음이에요.',
             '메뉴를 해시 맵에 담아 두면 주문마다 한 걸음이면 돼요. 그릇을 바꾸면 알고리즘이 바뀌어요.',
             '줄을 세워 두면(정렬) 찾기가 쉬워져요. 정렬된 목록은 반씩 줄여 가며 찾을 수 있어요.'] },
      { h: '메모리도 비용이에요' },
      { ul: ['큰 파일을 통째로 메모리에 올리면 조리대가 넘쳐요. 조금씩 읽어서 처리해요.',
             '경우의 수가 폭발하는 문제는 전부 해 볼 수 없어요. “충분히 좋은 답”을 찾는 방법을 써요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['“데이터가 100건일 때와 100만 건일 때”처럼 예상 규모를 말해 줘요. 그래야 알맞은 방법을 골라요.',
             '받은 코드에 반복 안의 반복이 있으면 “데이터가 늘면 어떻게 되는지” 물어봐요.',
             '“빠르게 해 줘”보다 “지금 몇 초 걸리는데 몇 초 안으로”라고 숫자로 말해요.'] }
    ],
    key: ['빠르기는 초가 아니라 걸음 수가 늘어나는 모양으로 말해요.', '반복 안의 반복은 걸음이 곱해지는 순간이에요.'],
    refs: [ch(9)] },

  { type: 'tb', no: '09', kicker: '상태와 동시성', title: '기억하는 것, 한꺼번에 하는 것', storyPage: 8,
    lede: '프로그램이 기억하고 있는 값이 상태예요. 버그의 대부분은 상태가 예상과 다르게 바뀌어서 생기고, 여러 일이 동시에 일어나면 더 어려워져요.',
    blocks: [
      { h: '상태를 다루는 원칙' },
      { ul: ['<b>원본은 한 곳에</b>: 같은 내용은 한 곳에만 적어요. 계산하면 나오는 값(합계 등)은 따로 적어 두지 않아요.',
             '<b>계산과 변경을 나누기</b>: 계산은 바깥을 건드리지 않는 함수로 하고, 바깥을 바꾸는 일은 눈에 띄는 한곳에 모아요.',
             '<b>있을 수 없는 상태를 못 만들게</b>: “접수 → 조리 중 → 배달 중 → 완료”처럼 갈 수 있는 길을 정해 둬요. 이게 <b>상태 기계</b>예요.'] },
      { h: '동시성: 번갈아 하기와 함께 하기' },
      { table: { head: ['말', '뜻', '주방에서는'], rows: [
        ['동시성', '여러 일을 번갈아 진행', '요리사 한 명이 냄비 세 개를 오가기'],
        ['병렬성', '여러 일을 정말 같은 순간에', '요리사 세 명이 각자 요리하기'],
        ['비동기', '기다리는 동안 다른 일 하기', '진동벨을 주고 다음 손님 받기']] } },
      { h: '경쟁 상태' },
      { p: '재료는 두 가지예요. <b>함께 쓰는 값</b>, 그리고 <b>확인과 변경 사이의 틈</b>. 둘 중 하나를 없애면 사라져요.' },
      { ul: ['한 번에 한 명만 고치게 잠그거나(<b>락</b>), “재고가 1 이상일 때만 1 줄여라”처럼 확인과 변경을 한 문장으로 묶어요.',
             '서로 상대가 가진 것을 기다리다 멈추는 것이 <b>교착 상태</b>예요. 잠그는 순서를 통일하면 피할 수 있어요.',
             '늦게 도착한 응답이 최신 화면을 덮어쓸 수 있어요. 요청에 번호표를 붙여 지난 응답은 버려요.'] },
      { h: 'AI에게 맡길 때' },
      { ul: ['“두 사람이 동시에 누르면 어떻게 되는지”를 꼭 물어봐요. AI는 한 사람만 쓸 때의 코드를 먼저 써요.',
             '시작한 일에는 주인이 있어야 해요. 시간 제한, 취소, 실패 처리가 있는지 확인해요.'] }
    ],
    key: ['같은 내용은 한 곳에만 적어요.', '느리면 먼저 물어요. 기다리는 중인가, 계산하는 중인가?'],
    refs: [ch(10), ch(11)] },

  { type: 'tb', no: '10', kicker: '디버깅과 테스트', title: '버그를 찾고, 돌아오지 못하게 하기', storyPage: 9,
    lede: '버그 찾기는 찍기가 아니라 수사예요. 그리고 테스트는 잡은 버그가 돌아오면 울리는 경보기예요.',
    blocks: [
      { h: '수사의 순서' },
      { ol: ['<b>다시 일으키기(재현)</b>: 어떤 순서로 하면 문제가 나는지 정확히 적어요. 재현이 안 되면 고쳤는지도 알 수 없어요.',
             '<b>오류 글 읽기</b>: 오류 종류, 메시지, 줄 번호가 현장에 남은 발자국이에요.',
             '<b>짐작을 세우고 절반씩 좁히기</b>: “여기까지는 값이 맞다”를 확인하며 범위를 반으로 줄여요.',
             '<b>고치고 테스트로 고정하기</b>: 같은 버그가 돌아오면 바로 알 수 있게 테스트를 남겨요.'] },
      { p: '문제가 <b>드러난 곳</b>은 출발점일 뿐이에요. 고칠 곳은 값이 <b>처음 잘못된 곳</b>이에요.' },
      { h: '테스트를 믿을 수 있으려면' },
      { ul: ['경계값을 넣어 봐요. 0개, 1개, 최대, 빈 값, 음수.',
             '작고 빠른 테스트를 많이, 전체를 도는 느린 테스트는 조금 둬요(테스트 피라미드).',
             '가끔 실패하는 테스트는 경보기를 못 믿게 만들어요. 원인을 찾아 고쳐요.',
             '느린 것도 버그예요. 추측하지 말고 재서, 가장 오래 걸리는 곳부터 고쳐요.'] },
      { h: 'AI에게 맡길 때' },
      { code: '10% 쿠폰을 쓰면 결제가 실패해. 순서는 이래.\n떡볶이 4,000원을 담는다 → 10% 쿠폰을 고른다 → 결제를 누른다.\n3,600원이 결제될 줄 알았는데 “결제에 실패했습니다”가 떠.\n오류 글 전체는 아래에 붙였어.\n\n바로 고치지 말고 원인부터 찾아서, 어떻게 확인했는지 알려 줘.\n그다음 이 버그를 잡는 테스트를 먼저 쓰고 실패하는 결과를 보여 줘.\n그 뒤에 고치고 같은 테스트가 통과하는 결과를 보여 줘.', cap: '원작 12장의 부탁 예시를 줄였어요.' },
      { ul: ['AI는 드러난 줄만 고치기 쉬워요. 오류를 <code>try</code>로 덮지 않았는지 봐요.',
             '테스트 쪽을 고쳐서 통과시키지 않았는지 <code>git diff</code>로 확인해요.',
             '돌려 보지 않고 “고쳤습니다”라고 할 수 있어요. 실행 결과를 그대로 붙여 달라고 해요.'] }
    ],
    key: ['“고쳤다”의 증거는 고치기 전에 실패하고 고친 뒤에 통과하는 테스트예요.', '고칠 곳은 드러난 곳이 아니라 처음 틀어진 곳이에요.'],
    refs: [ch(12)] },

  { type: 'tb', no: '11', kicker: '네트워크와 웹', title: '요청이 건너가는 길', storyPage: 10,
    lede: '네트워크는 컴퓨터 사이의 우편망이에요. 웹은 그 위에서 주문서(요청)와 답변서(응답)를 주고받는 약속이에요.',
    blocks: [
      { h: '주소 체계' },
      { table: { head: ['이름', '비유', '뜻'], rows: [
        ['IP 주소', '건물 주소', '어느 컴퓨터인지'],
        ['포트', '호수', '그 컴퓨터 안의 어느 프로그램인지'],
        ['DNS', '안내소', '이름(example.com)을 IP 주소로 바꿔 줘요'],
        ['<code>localhost</code>', '내 방', '언제나 입력한 기기 자신이에요']] } },
      { h: '안 될 때 확인하는 순서' },
      { p: '<b>이름 → 길 → 문 → 내용</b>. 이름이 주소로 바뀌는가, 그 주소까지 길이 닿는가, 그 포트에서 프로그램이 듣고 있는가, 주고받는 내용이 맞는가. 한 단계가 성공했다고 그 위 단계까지 성공한 것은 아니에요.' },
      { h: 'HTTP: 주문서와 답변서' },
      { ul: ['요청에는 <b>메서드</b>(GET은 보여 줘, POST는 만들어 줘), 주소, 헤더, 본문이 들어 있어요.',
             '응답 첫 줄의 <b>상태 코드</b>: 2xx는 성공, 4xx는 주문서를 고칠 일, 5xx는 가게(서버)를 살필 일이에요.',
             '<b>HTTPS</b>는 주문서를 잠긴 상자에 넣어 보내요. 가는 길에 엿보거나 바꿔치지 못해요.',
             '서버는 손님을 기억하지 못해요. 그래서 쿠키나 토큰 같은 출입증을 요청마다 함께 보내요.'] },
      { h: '답이 오지 않을 때' },
      { ul: ['시간 초과는 “안 됐다”가 아니라 “모른다”예요. 주문은 들어갔는데 답만 못 받았을 수 있어요.',
             '다시 보내기 전에 두 번 처리돼도 괜찮은 요청인지 확인해요. 이 성질이 <b>멱등성</b>이에요.',
             'CORS 오류는 서버의 거절이 아니라 브라우저의 검사예요. 고치는 곳은 서버의 응답 헤더예요.'] },

function startBook(def, myGen){

function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function refsHtml(refs){
  return '<p class="refs"><span>원문</span>' + refs.map(function(r){ return '<a href="' + r.url + '" target="_blank" rel="noopener">' + r.label + '</a>'; }).join('') + '</p>';
}
function renderPage(p, i){
  var plate = '<figure class="plate">' + scenes[i]() + '</figure>';
  var inner;

    inner = '<div class="text cover"><div class="text-inner">' +
      '<p class="chapter">' + p.kicker + '</p>' +
      '<h1>' + p.h1 + '</h1>' +
      '<p class="lead">' + p.lead + '</p>' +
      '<p class="legend"><i></i><span>' + p.legend + '</span></p>' +
      '<div class="actions"><button class="solid" type="button" data-go="1">책 펼치기</button><button class="ghost" type="button" data-go="' + PART2 + '">심화편 바로 가기</button><button class="ghost" type="button" id="resume" hidden></button></div>' +
      '<p class="credit">' + p.credit + '</p>' +
      '</div></div>';
  } else if (p.type === 'end'){
    inner = '<div class="text"><div class="text-inner">' +
      '<p class="chapter">' + p.chapter + '</p><h2>' + p.title + '</h2>' +
      '<dl class="glossary">' + p.words.map(function(w){ return '<dt>' + w[0] + '</dt><dd>' + w[1] + '</dd>'; }).join('') + '</dl>' +
      '<aside class="note"><p class="note-label">더 읽기</p><ul>' + p.notes.map(function(n){ return '<li>' + n + '</li>'; }).join('') +

      '</div></div>';
  } else if (p.type === 'tbcover'){
    inner = '<div class="text cover tb"><div class="text-inner">' +
      '<p class="chapter">2부 · 심화편</p>' +
      '<h1>' + p.h1 + '</h1>' +
      '<p class="lead">' + p.lead + '</p>' +
      '<ul class="tl">' + p.bullets.map(function(b){ return '<li>' + b + '</li>'; }).join('') + '</ul>' +
      '<div class="actions"><button class="solid" type="button" data-go="' + (PART2 + 1) + '">1장부터 읽기</button><button class="ghost" type="button" data-go="0">그림책 처음으로</button></div>' +
      '</div></div>';
  } else if (p.type === 'tb'){
    inner = '<div class="text tb"><div class="text-inner">' +
      '<p class="tb-kicker"><span class="tb-no">' + p.no + '</span><span>심화편 · ' + p.kicker + '</span></p>' +
      '<h2>' + p.title + '</h2>' +
      (p.lede ? '<p class="tb-lede">' + p.lede + '</p>' : '') +
      renderBlocks(p.blocks) +
      (p.key ? '<aside class="key"><p class="note-label">핵심 정리</p><ul>' + p.key.map(function(k){ return '<li>' + k + '</li>'; }).join('') + '</ul></aside>' : '') +
      '<div class="tb-foot">' + (p.refs ? refsHtml(p.refs) : '') +
        (p.storyPage ? '<button class="link-btn" type="button" data-go="' + p.storyPage + '">그림책 ' + p.storyPage + '쪽 다시 보기</button>' : '') + '</div>' +

        }).join('') + '</div>';
      }).join('') +
      '<h3>더 읽을거리</h3><ul class="tl">' + CORE.map(function(c){ return '<li><a href="' + c[1] + '" target="_blank" rel="noopener">' + c[0] + '</a></li>'; }).join('') + '</ul>' +
      '<div class="actions"><button class="solid" type="button" data-go="0">처음으로</button><button class="ghost" type="button" data-go="' + PART2 + '">심화편 처음으로</button></div>' +
      '</div></div>';
  } else {
    inner = '<div class="text"><div class="text-inner">' +
      '<p class="chapter">' + p.chapter + '</p><h2>' + p.title + '</h2>' +
      '<div class="story">' + p.story.map(function(s){ return '<p>' + s + '</p>'; }).join('') + '</div>' +
      '<aside class="note"><p class="note-label">' + (p.noteLabel || BOOK.noteLabel) + '</p><ul>' + p.note.map(function(n){ return '<li>' + n + '</li>'; }).join('') + '</ul>' +
      (p.refs ? refsHtml(p.refs) : '') + '</aside>' +
      '</div></div>';
  }
  var folio = '';
  if (p.type === 'tb') folio = '심화 ' + p.no;
  else if (i > 0 && i <= STORY_LAST) folio = String(i);
  return '<div class="face"><div class="page">' + plate + inner +
    (folio ? '<span class="folio">' + folio + '</span>' : '') + '</div><i class="fade" aria-hidden="true"></i></div>';
}
function renderBlocks(bs){
  function li(x){ return '<li>' + x + '</li>'; }
  return (bs || []).map(function(b){
    if (b.h) return '<h3>' + b.h + '</h3>';
    if (b.p) return '<p class="tp">' + b.p + '</p>';
    if (b.ul) return '<ul class="tl">' + b.ul.map(li).join('') + '</ul>';
    if (b.ol) return '<ol class="tl">' + b.ol.map(li).join('') + '</ol>';
    if (b.code) return '<figure class="code-fig"><pre class="code"><code>' + esc(b.code) + '</code></pre>' + (b.cap ? '<figcaption>' + b.cap + '</figcaption>' : '') + '</figure>';
    if (b.table){
      var t = b.table;
      return '<div class="tbl-wrap"><table class="tbl' + (t.wide ? ' tbl-wide' : '') + (t.xwide ? ' tbl-xwide' : '') + '"><thead><tr>' +
        t.head.map(function(h){ return '<th scope="col">' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
        t.rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>';
    }
    return '';
  }).join('');
}
function cleanTitle(s){ return String(s).replace(/[“”]/g, ''); }

/* ---------- 책장 넘기기 ---------- */
var book = document.getElementById('book');
var leaves = [];
pages.forEach(function(p, i){
  var el = document.createElement('article');
  var isTb = p.type === 'tbcover' || p.type === 'tb' || p.type === 'check';
  el.className = 'leaf' + (isTb ? ' tbp' : '');
  el.setAttribute('aria-label', i === 0 ? '표지' : (p.type === 'tb' ? '심화편 ' + parseInt(p.no, 10) + '장: ' + cleanTitle(p.title) : (isTb ? cleanTitle(p.title) : i + '쪽: ' + cleanTitle(p.title))));
  el.innerHTML = renderPage(p, i);
  /* 앞쪽 페이지가 DOM에서도 위에 오도록 거꾸로 넣는다 (z-index를 무시하는 브라우저 대비) */
  book.insertBefore(el, book.firstChild);
  leaves.push(el);
});
var N = leaves.length;
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DUR = reduce ? 0 : 600;
var cur = 0;
var busy = null;

/* 화면 크기에 맞춰 그림 크기와 넓은/좁은 배치를 정한다 (컨테이너 쿼리 대신 JS로 계산) */
function layout(){
  var W = book.clientWidth, H = book.clientHeight;
  if (!W || !H) return;
  var wide = W >= 700 && H >= 400;
  book.classList.toggle('wide', wide);
  var pw, ph, pwt, pht;
  if (wide){
    var innerW = W - 102, innerH = H - 80;
    pw = (innerW - 44) * 1.25 / 2.25; ph = pw * 0.625;
    if (ph > innerH){ ph = innerH; pw = ph / 0.625; }
    /* 심화편은 글이 길어서 그림 칸을 조금 줄인다 */
    pwt = (innerW - 44) / 2.15; pht = pwt * 0.625;
    if (pht > innerH){ pht = innerH; pwt = pht / 0.625; }
  } else {
    pw = W - 38; ph = pw * 0.625;
    var cap = Math.max(140, H * 0.42);
    if (ph > cap){ ph = cap; pw = ph / 0.625; }
    pwt = pw; pht = ph;
  }
  book.style.setProperty('--pw', Math.floor(pw) + 'px');
  book.style.setProperty('--ph', Math.floor(ph) + 'px');
  book.style.setProperty('--pwt', Math.floor(pwt) + 'px');
  book.style.setProperty('--pht', Math.floor(pht) + 'px');
}
layout();
if (window.ResizeObserver){ try { new ResizeObserver(layout).observe(book); } catch (e) {} }
window.addEventListener('resize', function(){ if (myGen === GEN) layout(); });

var trackFill = document.getElementById('trackFill'), trackTick = document.getElementById('trackTick');
var brandEl = document.getElementById('brand');
trackTick.style.left = (PART2 / (N - 1) * 100) + '%';

/* keep: 넘어가는 중인 쪽도 잠깐 애니메이션을 유지 */
function setPlay(keep){
  leaves.forEach(function(l, i){
    var on = i === cur || i === keep;
    var svg = l.querySelector('svg');
    if (on){
      l.classList.add('play');
      if (svg && svg.unpauseAnimations && !reduce) svg.unpauseAnimations();
    } else {
      l.classList.remove('play');
      if (svg && svg.pauseAnimations) svg.pauseAnimations();
    }
  });
}
/* 멈춰 있을 때는 지금 쪽 하나만 보인다 */
function rest(){
  leaves.forEach(function(l, i){
    l.classList.remove('lift', 'under', 'anim', 'fwd', 'back');
    l.classList.toggle('cur', i === cur);
    l.classList.toggle('away', i < cur);
  });
}
function finish(){
  if (busy){ clearTimeout(busy); busy = null; }
  rest();
  setPlay();
}
/* 넘길 때는 '지금 쪽'과 '다음 쪽' 두 장만 보인다. 앞뒷면 없이 반 바퀴(90도)만 돌린다. */
function go(target){
  target = Math.max(0, Math.min(N - 1, target));
  if (target === cur) return;
  if (busy) finish();
  var from = cur;
  var A = leaves[from], B = leaves[target];
  cur = target;
  var pg = B.querySelector('.page'), tx = B.querySelector('.text');
  if (pg) pg.scrollTop = 0;
  if (tx) tx.scrollTop = 0;
  updateUI();
  if (DUR === 0){ finish(); return; }
  if (target > from){
    B.classList.remove('away');
    B.classList.add('under');
    A.classList.add('lift', 'anim', 'fwd');
    void A.offsetWidth;
    A.classList.add('away');
  } else {
    A.classList.remove('cur');
    A.classList.add('under');
    B.classList.add('away', 'lift');
    void B.offsetWidth;
    B.classList.add('anim', 'back');
    B.classList.remove('away');
  }
  setPlay(from);
  busy = setTimeout(finish, DUR + 40);
}

var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
var whereEl = document.getElementById('where'), liveEl = document.getElementById('live');
function label(i){
  var p = pages[i];
  if (i === 0) return '표지';
  if (i <= STORY_LAST) return '그림책 ' + i + ' / ' + STORY_LAST + ' · ' + cleanTitle(p.title);
  if (p.type === 'tbcover') return '심화편 · 표지';
  if (p.type === 'check') return '심화편 · 점검표';
  return '심화편 ' + parseInt(p.no, 10) + '장 · ' + cleanTitle(p.title);
}
function updateUI(){
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === N - 1;
  trackFill.style.width = (cur / (N - 1) * 100) + '%';
  brandEl.innerHTML = cur >= PART2 ? BOOK.brand2 : BOOK.brand1;
  whereEl.textContent = label(cur);
  liveEl.textContent = label(cur);
  leaves.forEach(function(l, i){
    var hide = i !== cur;
    l.setAttribute('aria-hidden', hide ? 'true' : 'false');
    l.inert = hide;
  });
  tocItems.forEach(function(b, i){ if (i === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  try { history.replaceState(null, '', '#' + BOOK.hash + '-p' + cur); } catch (e) {}
  try { if (cur > 0) localStorage.setItem(BOOK.id + '-page', String(cur)); } catch (e) {}
}

/* 목차 */
var toc = document.getElementById('toc'), tocList = document.getElementById('tocList');
var tocBtn = document.getElementById('tocBtn'), tocClose = document.getElementById('tocClose');
tocList.innerHTML = pages.map(function(p, i){
  var head = i === 0 ? '<li class="toc-part">1부 · 그림책</li>' : (i === PART2 ? '<li class="toc-part">2부 · 심화편</li>' : '');
  var n = (i === 0 || i === PART2) ? '—' : (p.type === 'tb' ? p.no + '장' : (p.type === 'check' ? '끝' : String(i).padStart(2, '0')));
  var c = p.type === 'tb' ? p.kicker : p.chapter;
  return head + '<li><button type="button" data-go="' + i + '"><span class="n">' + n + '</span><span>' +
    (c ? '<span class="c">' + c + '</span>' : '') + esc(cleanTitle(p.title)) + '</span></button></li>';
}).join('');
var tocItems = Array.prototype.slice.call(tocList.querySelectorAll('button'));
function openToc(){ toc.hidden = false; tocClose.focus(); }
function closeToc(){ toc.hidden = true; tocBtn.focus(); }
tocBtn.addEventListener('click', openToc);
tocClose.addEventListener('click', closeToc);
toc.addEventListener('click', function(e){ if (e.target === toc) closeToc(); });

document.addEventListener('click', function(e){
  if (myGen !== GEN) return;
  var b = e.target.closest('[data-go]');
  if (!b) return;
  var t = parseInt(b.getAttribute('data-go'), 10);
  if (!toc.hidden) { toc.hidden = true; }
  go(t);
});
prevBtn.addEventListener('click', function(){ go(cur - 1); });
nextBtn.addEventListener('click', function(){ go(cur + 1); });
document.addEventListener('keydown', function(e){
  if (myGen !== GEN) return;
  if (!toc.hidden){ if (e.key === 'Escape') closeToc(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(N - 1);
});

/* 손가락으로 넘기기 */
var sx = null, sy = 0;
book.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse') return;
  sx = e.clientX; sy = e.clientY;
});
book.addEventListener('pointerup', function(e){
  if (sx === null) return;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  sx = null;
  if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.3) go(cur + (dx < 0 ? 1 : -1));
});
book.addEventListener('pointercancel', function(){ sx = null; });

/* 처음 펼칠 쪽 */
function fromHash(){ var m = new RegExp('^#' + BOOK.hash + '-p(\\d+)$').exec(location.hash || ''); return m ? Math.min(N - 1, parseInt(m[1], 10)) : null; }
var start = fromHash();
if (start !== null) cur = start;
rest();
updateUI();
setPlay();
layout();
window.addEventListener('hashchange', function(){ if (myGen !== GEN) return; var h = fromHash(); if (h !== null && h !== cur) go(h); });

/* 점검표 체크 표시 (이 브라우저에만 저장) */
var CK_KEY = BOOK.id + '-checks', ckState = {};
try { ckState = JSON.parse(localStorage.getItem(CK_KEY) || '{}') || {}; } catch (e) { ckState = {}; }
var ckBoxes = Array.prototype.slice.call(document.querySelectorAll('[data-ck]'));
function ckRender(){
  var n = ckBoxes.filter(function(b){ return b.checked; }).length;
  var el = document.getElementById('ckCount');
  if (el) el.textContent = n + ' / ' + ckBoxes.length + ' 확인함';
}
ckBoxes.forEach(function(b){
  var k = b.getAttribute('data-ck');
  b.checked = !!ckState[k];
  b.addEventListener('change', function(){
    ckState[k] = b.checked;
    try { localStorage.setItem(CK_KEY, JSON.stringify(ckState)); } catch (e) {}
    ckRender();
  });
});
ckRender();

var saved = null;
try { saved = parseInt(localStorage.getItem(BOOK.id + '-page') || '', 10); } catch (e) {}
var resume = document.getElementById('resume');
if (resume && saved && saved > 0 && saved < N && start === null){
  resume.hidden = false;
  resume.textContent = '이어 읽기: ' + label(saved);
  resume.setAttribute('data-go', String(saved));
}

}

/* ---------- 책장: 책 고르기 ---------- */
var SHELF = [
  { key: 'cs', vol: '첫째 권 · 기초', title: '떡볶이 주문의 여행', desc: '“주문하기” 버튼을 누른 뒤 0.15초 동안 무슨 일이 일어날까요? 주문 쪽지 ‘또또’를 따라가며 컴퓨터, 인터넷, 서버가 일하는 원리를 배워요.', meta: ['그림책 15쪽', '교과서 14장', '컴퓨터 과학 기초'] },
  { key: 'harness', vol: '둘째 권 · AI 협업', title: '번개와 다섯 가지 장비', desc: 'AI 코딩 에이전트에게 일을 믿고 맡기려면 무엇이 필요할까요? 똑똑하지만 덤벙대는 말 ‘번개’와 함께 하네스 엔지니어링을 배워요.', meta: ['그림책 15쪽', '교과서 14장', '하네스 엔지니어링'] }
];
var DEFS = {}, GEN = 0;
function getDef(key){ if (!DEFS[key]) DEFS[key] = BOOKS[key](); return DEFS[key]; }
var shelfEl = document.getElementById('shelf'), rootEl = document.getElementById('root'), shellTpl = document.getElementById('shellTpl');
function openBook(key){
  var def = getDef(key);
  GEN += 1;
  shelfEl.hidden = true;
  rootEl.hidden = false;
  rootEl.innerHTML = shellTpl.innerHTML;
  document.title = def.cfg.title;
  startBook(def, GEN);
}
function openShelf(){
  GEN += 1;
  rootEl.innerHTML = '';
  rootEl.hidden = true;
  shelfEl.hidden = false;
  document.title = 'AI 개발 책장';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  shelfEl.scrollTop = 0;
}
document.getElementById('shelfBooks').innerHTML = SHELF.map(function(b){
  var def = getDef(b.key), saved = 0;
  try { saved = parseInt(localStorage.getItem(def.cfg.id + '-page') || '', 10) || 0; } catch (e) {}
  return '<article class="bookcard"><figure class="plate play" style="margin:0">' + def.scenes[0]() + '</figure>' +
    '<p class="vol">' + b.vol + '</p><h2>' + b.title + '</h2><p class="desc">' + b.desc + '</p>' +
    '<ul class="meta">' + b.meta.map(function(m){ return '<li>' + m + '</li>'; }).join('') + '</ul>' +
    '<div class="actions"><button class="solid" type="button" data-book="' + b.key + '">' + (saved > 0 ? '이어서 읽기' : '읽기 시작') + '</button>' +
    (saved > 0 ? '<button class="ghost" type="button" data-book="' + b.key + '" data-first="1">처음부터</button>' : '') + '</div></article>';
}).join('');
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-book],#shelfBtn') : null;
  if (!t) return;
  if (t.id === 'shelfBtn'){ openShelf(); return; }
  var key = t.getAttribute('data-book'), def = getDef(key);
  if (t.getAttribute('data-first')){ try { history.replaceState(null, '', '#' + def.cfg.hash + '-p0'); } catch (e2) {} }
  else {
    var sv = 0; try { sv = parseInt(localStorage.getItem(def.cfg.id + '-page') || '', 10) || 0; } catch (e3) {}
    try { history.replaceState(null, '', '#' + def.cfg.hash + '-p' + sv); } catch (e4) {}
  }
  openBook(key);
});
var hm = /^#(harness|cs)(-p\d+)?$/.exec(location.hash || '');
if (hm) openBook(hm[1]);

})();
</script>
